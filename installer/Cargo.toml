[package]
name = "claude_crab_setup"
version = "1.3.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ClaudeCrab-Setup"
path = "src/main.rs"

[dependencies]
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links"] }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
